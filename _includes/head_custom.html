<!-- Cleaner reading font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ===== Readability + layout enhancements ===== -->
<style>
  .main-content, .side-bar, .site-title, .main-header, #nav-toggle {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* Comfortable, centered reading column */
  .main-content {
    max-width: 860px;
    margin-left: auto;
    margin-right: auto;
    font-size: 17px;
    line-height: 1.7;
    color: #1b2733;
  }
  .main-content p, .main-content li { margin-bottom: 0.45rem; }
  .main-content h1 { font-weight: 700; color: #0b2545; }
  .main-content h2 { font-weight: 600; color: #0b2545; margin-top: 2rem; padding-top: 0.6rem; border-top: 1px solid #eef0f3; }
  .main-content h3, .main-content h4, .main-content h5 { font-weight: 600; color: #0b2545; }
  .main-content a:not(.btn) { color: #0a56c2; }
  .main-content a:not(.btn):hover { text-decoration: underline; }
  .main-content strong { color: #0b2545; }

  .main-content blockquote {
    border-left: 4px solid #c9a23f;
    background: #faf7ef;
    padding: 0.6rem 1rem;
    margin: 1rem 0;
    color: #33404d;
  }

  .main-content table th { background: #0b2545; color: #fff; }
  .main-content table td, .main-content table th { border: 1px solid #e3e6ea; }
  .main-content table tbody tr:nth-child(even) { background: #f6f8fa; }

  .main-content code { background: #eef1f4; color: #b5370f; padding: .12em .35em; border-radius: 4px; }
  .main-content pre { background: #f6f8fa; border: 1px solid #e3e6ea; border-radius: 6px; }
  .main-content pre code { background: transparent; color: #24292f; }
  .mermaid { margin: 1.25rem 0; text-align: center; overflow-x: auto; }
  /* The theme's badge class also matches Mermaid labels. Undo it here. */
  .main-content .mermaid .label,
  .main-content .mermaid .nodeLabel,
  .main-content .mermaid .edgeLabel {
    display: inline; padding: 0; margin: 0; border-radius: 0;
    background: transparent; color: inherit; font-size: 16px !important;
    text-transform: none !important; letter-spacing: normal; line-height: 1.4;
    font-family: Arial, sans-serif !important;
  }
  .main-content .mermaid svg { max-width: none !important; }
  .mermaid:focus-visible, #nav-toggle:focus-visible {
    outline: 3px solid #0a56c2; outline-offset: 3px;
  }
  .diagram-hint { font-size: .875rem; color: #33404d; }

  /* ===== Collapsible sidebar (desktop) ===== */
  #nav-toggle {
    position: fixed; bottom: 1rem; left: 1rem; z-index: 1000;
    display: none;
    background: #0b2545; color: #fff; border: 0; border-radius: 6px;
    padding: 0.4rem 0.7rem; font-size: 0.85rem; cursor: pointer; line-height: 1;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  #nav-toggle:hover { background: #123a6b; }

  @media (min-width: 50rem) {
    #nav-toggle { display: block; }
    .side-bar { padding-bottom: 4rem; }
    body.nav-collapsed .side-bar { display: none; }
    /* Center the whole content area when the menu is hidden, so it is not left-stranded */
    body.nav-collapsed .main {
      margin-left: auto !important;
      margin-right: auto !important;
      max-width: 1080px;
    }
    body.nav-collapsed .main-content-wrap { padding-top: 2.25rem; }
  }
</style>
<script>
  (function () {
    function initToggle() {
      if (!document.body || document.getElementById('nav-toggle')) return;
      var btn = document.createElement('button');
      btn.id = 'nav-toggle';
      btn.type = 'button';
      var sidebar = document.querySelector('.side-bar');
      if (!sidebar) return;
      sidebar.id = sidebar.id || 'course-sidebar';
      btn.setAttribute('aria-controls', sidebar.id);
      function label() {
        var collapsed = document.body.classList.contains('nav-collapsed');
        btn.textContent = collapsed ? '☰  Menu' : '⟨  Hide menu';
        btn.setAttribute('aria-expanded', String(!collapsed));
      }
      try { if (localStorage.getItem('nbNavCollapsed') === '1') document.body.classList.add('nav-collapsed'); } catch (e) {}
      label();
      btn.addEventListener('click', function () {
        document.body.classList.toggle('nav-collapsed');
        try { localStorage.setItem('nbNavCollapsed', document.body.classList.contains('nav-collapsed') ? '1' : '0'); } catch (e) {}
        label();
      });
      document.body.appendChild(btn);
    }
    if (document.body) initToggle();
    document.addEventListener('DOMContentLoaded', initToggle);
    var t = setInterval(function () { if (document.body) { initToggle(); clearInterval(t); } }, 200);
    setTimeout(function () { clearInterval(t); }, 10000);
  })();
</script>

<!-- ===== Render Mermaid diagrams inside lessons ===== -->
<script>
  window.__renderMermaid = function () {
    if (!window.mermaid) return false;
    document.querySelectorAll('.language-mermaid').forEach(function (w) {
      var d = document.createElement('div');
      d.className = 'mermaid';
      d.textContent = w.textContent.replace(/\n$/, '');
      /* Replace the preformatted wrapper too, so diagram help text can wrap. */
      var host = w.parentElement && w.parentElement.tagName === 'PRE' ? w.parentElement : w;
      host.parentNode.replaceChild(d, host);
    });
    try {
      window.mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        themeCSS: '.label, .nodeLabel, .edgeLabel { font-family: Arial, sans-serif !important; font-size: 16px !important; text-transform: none !important; letter-spacing: normal; }',
        themeVariables: {
          fontFamily: "Arial, sans-serif",
          fontSize: "16px",
          primaryColor: "#eef2f7",
          primaryTextColor: "#0b2545",
          primaryBorderColor: "#0b2545",
          lineColor: "#0b2545",
          tertiaryColor: "#faf7ef",
          clusterBkg: "#faf7ef",
          clusterBorder: "#c9a23f",
          edgeLabelBackground: "#ffffff"
        }
      });
    } catch (e) {}
    window.mermaid.run().then(function () {
      document.querySelectorAll('.mermaid svg').forEach(function (svg) {
        var box = svg.viewBox.baseVal;
        if (box && box.width) {
          svg.style.width = box.width + 'px';
          svg.style.height = 'auto';
        }
        var region = svg.parentElement;
        region.setAttribute('tabindex', '0');
        region.setAttribute('role', 'region');
        region.setAttribute('aria-label', 'Course diagram; scroll horizontally if needed');
        if (!region.nextElementSibling || !region.nextElementSibling.classList.contains('diagram-hint')) {
          var hint = document.createElement('p');
          hint.className = 'diagram-hint';
          hint.textContent = 'On a narrow screen, scroll the diagram sideways. Its flow is also explained in the surrounding text.';
          region.insertAdjacentElement('afterend', hint);
        }
      });
    }).catch(function (error) { console.error('Course diagram rendering failed', error); });
    return true;
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" onload="window.__renderMermaid()"></script>
<script>
  (function () {
    var n = 0;
    var timer = setInterval(function () {
      n++;
      if (window.mermaid && document.querySelector('.language-mermaid')) {
        window.__renderMermaid();
      }
      if (n > 150 || !document.querySelector('.language-mermaid')) {
        clearInterval(timer);
      }
    }, 200);
  })();
</script>

<style>
/* Question-bank reading distinction */
.qb-question, .qb-question strong { color: #173f78; }
.qb-question { font-weight: 600; }
.qb-explanation, .qb-explanation p, .qb-explanation strong { color: #245946; }
.qb-explanation { margin-bottom: 1.4rem; }
.main-content .qb-question code, .main-content .qb-explanation code {
  white-space: normal;
  overflow-wrap: anywhere;
}
</style>

<style>
.qb-answer { border-bottom: 1px solid #d8e1df; margin: 0; padding: 0.7rem 0; }
.qb-answer > summary { color: #173f78; font-weight: 600; cursor: pointer; }
.qb-answer[open] > summary { margin-bottom: 1rem; }
.qb-answer > summary:focus-visible { outline: 2px solid #173f78; outline-offset: 4px; }
</style>

<script>
(function () {
  function openBankAnswer() {
    var id = decodeURIComponent(location.hash.slice(1));
    var target = document.getElementById(id);
    if (!target || !target.matches('details.qb-answer')) return;
    target.open = true;
    target.scrollIntoView();
  }
  document.addEventListener('DOMContentLoaded', openBankAnswer);
  window.addEventListener('hashchange', openBankAnswer);
})();
</script>
